<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noor | Professional Reference SPA</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --bg: #050505;
            --card: #111111;
            --text: #e6edf3;
            --text-dim: #6e7681;
            --border: #222222;
            --blue-next: #3b82f6;
            --grey-prev: #30363d;
        }

        * { box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden;}

        /* Global Sticky Header */
        .global-header {
            width: 100%;
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 1.5rem;
            position: fixed;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .global-time { font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; margin: 0; line-height: 1; color: #fff; }
        .global-dates { text-align: right; }
        .global-hijri { color: var(--primary); font-weight: 700; font-size: 1rem; }
        .global-gregorian { color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }

        /* Navigation */
        nav { 
            width: 100%; 
            max-width: 1000px; 
            display: flex; 
            background: var(--bg); 
            position: sticky; 
            top: 80px; 
            z-index: 900; 
            border-bottom: 1px solid var(--border);
            margin-top: 85px; /* Offset for global header */
        }
        nav button { flex: 1; background: none; border: none; color: var(--text-dim); cursor: pointer; font-weight: 700; font-size: 0.8rem; padding: 15px; border-bottom: 2px solid transparent; }
        nav button.active { color: var(--primary); border-bottom: 2px solid var(--primary); }

        .container { width: 95%; max-width: 1000px; padding: 2rem 0; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Dashboard & Clock */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px; }
        @media (max-width: 768px) { .dashboard-grid { grid-template-columns: 1fr; } }

        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; margin-bottom: 20px;}

        .analog-clock {
            width: 220px; height: 220px; border: 4px solid var(--border); border-radius: 50%;
            margin: 1rem auto; position: relative; background: #000;
        }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; background: #fff; border-radius: 4px; z-index: 10; }
        #hour-hand { width: 4px; height: 55px; background: var(--primary); }
        #min-hand { width: 2px; height: 85px; }
        #sec-hand { width: 1px; height: 95px; background: #ff3366; }
        
        .marker { position: absolute; font-size: 11px; font-weight: 600; transform: translate(-50%, -50%); color: var(--text-dim); }
        .marker.prayer { background: #111; padding: 2px 5px; border-radius: 4px; border: 1px solid var(--border); z-index: 5; font-size: 9px; }

        /* Tables */
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase; }
        
        tr.prev-prayer { opacity: 0.4; }
        tr.next-prayer { color: var(--blue-next); background: rgba(59, 130, 246, 0.05); font-weight: 600; }
        tr.current-prayer { background: rgba(255, 255, 255, 0.03); }

        /* Form Styling */
        .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .filter-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        .filter-group label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 5px; font-weight: 800; }
        select, input { padding: 10px; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 8px; }
        button.action-btn { background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; }
        
        .status-badge { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 800; text-transform: uppercase; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<header class="global-header">
    <div>
        <h1 class="global-time" id="global-time">00:00:00</h1>
        <div style="color: var(--text-dim); font-size: 0.75rem; font-weight: 600;" id="location-display">Loading Data...</div>
    </div>
    <div class="global-dates">
        <div class="global-hijri" id="global-hijri">...</div>
        <div class="global-gregorian" id="global-gregorian">...</div>
    </div>
</header>

<nav>
    <button class="active" onclick="switchTab('dash', this)">DASHBOARD</button>
    <button onclick="switchTab('calendar', this)">CALENDAR</button>
    <button onclick="switchTab('settings', this)">SETTINGS</button>
</nav>

<div class="container">
    <div id="dash" class="tab-content active">
        <div class="dashboard-grid">
            <div class="card" style="text-align: center;">
                <h3 style="margin:0; font-size: 0.9rem; color: var(--text-dim);">PRAYER CLOCK</h3>
                <div class="analog-clock" id="prayer-clock">
                    <div id="clock-face"></div>
                    <div class="hand" id="hour-hand"></div>
                    <div class="hand" id="min-hand"></div>
                    <div class="hand" id="sec-hand"></div>
                </div>
                <div id="current-prayer-name" style="font-weight: 800; font-size: 1.2rem; color: var(--primary);">---</div>
            </div>

            <div class="card" style="overflow-x: auto;">
                <table id="today-table">
                    <thead><tr><th>Event</th><th>Time</th><th>Status</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="calendar" class="tab-content">
        <div class="card">
            <div class="settings-grid" style="margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px;">
                <div class="filter-group">
                    <label>View Mode</label>
                    <select id="filter-mode" onchange="toggleFilterMode()">
                        <option value="gregorian">By Gregorian Month</option>
                        <option value="hijri">By Hijri Month</option>
                        <option value="range">By Date Range</option>
                    </select>
                </div>
                <div class="filter-group mode-gregorian">
                    <label>Month</label>
                    <select id="filter-greg-month" onchange="applyCalendarFilters()"></select>
                </div>
                <div class="filter-group mode-hijri hidden">
                    <label>Hijri Month</label>
                    <select id="filter-hijri-month" onchange="applyCalendarFilters()"></select>
                </div>
                <div class="filter-group mode-range hidden">
                    <label>From - To</label>
                    <div style="display: flex; gap: 5px;">
                        <input type="date" id="filter-from-date" onchange="applyCalendarFilters()">
                        <input type="date" id="filter-to-date" onchange="applyCalendarFilters()">
                    </div>
                </div>
            </div>
            <div style="overflow-x: auto;">
                <table id="month-table">
                    <thead><tr><th>Date</th><th>Fajr</th><th>Sunrise</th><th>Dhuhr</th><th>Asr</th><th>Maghrib</th><th>Isha</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="settings" class="tab-content">
        <div class="card">
            <h3>Display Preferences</h3>
            <div class="settings-grid">
                <div class="filter-group">
                    <label>Time Format</label>
                    <select id="time-format" onchange="updateUI()">
                        <option value="12">12-Hour (AM/PM)</option>
                        <option value="24">24-Hour (Military)</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Clock Face</label>
                    <select id="clock-mode" onchange="drawClockMarkers()">
                        <option value="overlapped">Numbers & Prayers</option>
                        <option value="prayer">Prayers Only</option>
                        <option value="standard">Numbers Only</option>
                    </select>
                </div>
            </div>
            <hr style="border:0; border-top:1px solid var(--border); margin: 20px 0;">
            <h3>Location & Calculation</h3>
            <div class="settings-grid">
                <div class="filter-group"><label>Country</label><select id="country-select"></select></div>
                <div class="filter-group"><label>City</label><input type="text" id="city-input" value="Islamabad"></div>
                <div class="filter-group"><label>Method</label><select id="method-select"></select></div>
                <div class="filter-group"><label>School (Asr)</label><select id="fiqh-select">
                    <option value="0">Standard (Shafi/Maliki/Hanbali)</option>
                    <option value="1">Hanafi</option>
                </select></div>
            </div>
            <button class="action-btn" onclick="fetchAnnualData()">Update All Reference Data</button>
        </div>
    </div>
</div>

<script>
    let state = {
        city: 'Islamabad', country: 'Pakistan', method: 3, school: 0,
        annualData: [], todayData: null, timezone: 'Asia/Karachi',
        isLoading: true
    };

    const mainPrayers = ["Fajr", "Dhuhr", "Asr", "Maghrib", "Isha"];
    const allEvents = ["Fajr", "Sunrise", "Dhuhr", "Asr", "Sunset", "Maghrib", "Isha", "Midnight"];

    window.onload = async () => {
        setupSettings();
        await fetchAnnualData();
        // Start the master loop
        setInterval(tick, 1000);
    };

    function setupSettings() {
        const gregM = document.getElementById('filter-greg-month');
        ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"].forEach((m, i) => {
            gregM.innerHTML += `<option value="${i+1}">${m}</option>`;
        });
        gregM.value = new Date().getMonth() + 1;

        const hijriM = document.getElementById('filter-hijri-month');
        ["Muharram", "Safar", "Rabi I", "Rabi II", "Jumada I", "Jumada II", "Rajab", "Sha'ban", "Ramadan", "Shawwal", "Dhu al-Qi'dah", "Dhu al-Hijjah"].forEach((m, i) => {
            hijriM.innerHTML += `<option value="${i+1}">${i+1} - ${m}</option>`;
        });

        const methods = { 1: "Egyptian", 2: "ISNA", 3: "MWL", 4: "Makkah", 5: "Karachi", 7: "Tehran", 12: "France" };
        const methSelect = document.getElementById('method-select');
        for (let key in methods) methSelect.innerHTML += `<option value="${key}">${methods[key]}</option>`;
        methSelect.value = 3;

        fetch("https://restcountries.com/v3.1/all?fields=name")
            .then(r => r.json()).then(data => {
                const s = document.getElementById('country-select');
                data.map(c => c.name.common).sort().forEach(c => s.innerHTML += `<option value="${c}" ${c==='Pakistan'?'selected':''}>${c}</option>`);
            });
    }

    async function fetchAnnualData() {
        state.isLoading = true;
        state.city = document.getElementById('city-input').value;
        state.country = document.getElementById('country-select').value;
        state.method = document.getElementById('method-select').value;
        state.school = document.getElementById('fiqh-select').value;

        try {
            const year = new Date().getFullYear();
            const res = await fetch(`https://api.aladhan.com/v1/calendarByCity/${year}?city=${state.city}&country=${state.country}&method=${state.method}&school=${state.school}`);
            const json = await res.json();
            state.annualData = Object.values(json.data).flat();
            state.timezone = state.annualData[0].meta.timezone;
            
            updateTodayPointer();
            updateUI();
            state.isLoading = false;
        } catch (e) {
            console.error("Fetch failed", e);
            alert("Error fetching data. Check city name.");
        }
    }

    function updateTodayPointer() {
        const todayStr = new Date().toLocaleDateString('en-GB', {timeZone: state.timezone}).replace(/\//g, '-');
        state.todayData = state.annualData.find(d => d.date.gregorian.date === todayStr) || state.annualData[0];
        
        document.getElementById('location-display').innerText = `${state.city}, ${state.country}`;
        document.getElementById('global-hijri').innerText = `${state.todayData.date.hijri.day} ${state.todayData.date.hijri.month.en} ${state.todayData.date.hijri.year}`;
        document.getElementById('global-gregorian').innerText = state.todayData.date.gregorian.date;
    }

    function tick() {
        if (state.isLoading) return;
        
        const now = new Date(new Date().toLocaleString("en-US", { timeZone: state.timezone }));
        const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
        
        // Update Digital Displays
        const is12 = document.getElementById('time-format').value === '12';
        document.getElementById('global-time').innerText = now.toLocaleTimeString('en-US', { hour12: is12 });

        // Update Hands
        document.getElementById('hour-hand').style.transform = `rotate(${(h % 12) * 30 + m/2}deg)`;
        document.getElementById('min-hand').style.transform = `rotate(${m * 6}deg)`;
        document.getElementById('sec-hand').style.transform = `rotate(${s * 6}deg)`;

        updateVisuals(h * 60 + m);
    }

    function updateVisuals(nowMins) {
        const times = mainPrayers.map(p => {
            const [h, m] = state.todayData.timings[p].split(' ')[0].split(':').map(Number);
            return h * 60 + m;
        });

        let currentIdx = -1;
        for (let i = times.length - 1; i >= 0; i--) {
            if (nowMins >= times[i]) { currentIdx = i; break; }
        }
        if (currentIdx === -1) currentIdx = 4; // Before Fajr is Isha territory

        const nextIdx = (currentIdx + 1) % 5;
        let start = times[currentIdx];
        let end = times[nextIdx];
        
        if (currentIdx === 4 && nowMins < times[0]) start -= 1440; 
        if (currentIdx === 4 && nowMins >= times[4]) end += 1440;

        const ratio = Math.max(0, Math.min(1, (nowMins - start) / (end - start)));
        const hue = 120 * (1 - ratio);
        const color = `hsl(${hue}, 80%, 50%)`;

        document.getElementById('current-prayer-name').innerText = mainPrayers[currentIdx].toUpperCase();
        document.getElementById('current-prayer-name').style.color = color;

        // Update Table Rows
        const tbody = document.querySelector('#today-table tbody');
        tbody.innerHTML = allEvents.map(p => {
            const mIdx = mainPrayers.indexOf(p);
            let status = '', cls = '';
            if (mIdx !== -1) {
                if (mIdx === currentIdx) { 
                    status = `<span class="status-badge" style="background:${color}; color:#000">Current</span>`; 
                    cls = 'current-prayer'; 
                }
                else if (mIdx === nextIdx) { status = `<span class="status-badge" style="background:var(--blue-next); color:#fff">Next</span>`; cls = 'next-prayer'; }
                else if ( (mIdx < currentIdx && currentIdx !== 4) || (currentIdx === 4 && mIdx < 4)) { cls = 'prev-prayer'; }
            }
            return `<tr class="${cls}"><td>${p}</td><td>${formatTime(state.todayData.timings[p])}</td><td>${status}</td></tr>`;
        }).join('');
    }

    function formatTime(t) {
        const is12 = document.getElementById('time-format').value === '12';
        let [h, m] = t.split(' ')[0].split(':');
        if (!is12) return `${h}:${m}`;
        let ampm = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
        return `${h}:${m} ${ampm}`;
    }

    function drawClockMarkers() {
        const face = document.getElementById('clock-face');
        const mode = document.getElementById('clock-mode').value;
        face.innerHTML = '';
        
        if (mode !== 'prayer') {
            for(let i=1; i<=12; i++) {
                const angle = i * 30 - 90;
                const r = mode === 'overlapped' ? 30 : 40;
                const x = 50 + r * Math.cos(angle * Math.PI / 180);
                const y = 50 + r * Math.sin(angle * Math.PI / 180);
                face.innerHTML += `<div class="marker" style="left:${x}%; top:${y}%">${i}</div>`;
            }
        }
        if (mode !== 'standard') {
            mainPrayers.forEach(p => {
                const [h, m] = state.todayData.timings[p].split(' ')[0].split(':');
                const angle = (parseInt(h) % 12 + parseInt(m)/60) * 30 - 90;
                const x = 50 + 44 * Math.cos(angle * Math.PI / 180);
                const y = 50 + 44 * Math.sin(angle * Math.PI / 180);
                face.innerHTML += `<div class="marker prayer" style="left:${x}%; top:${y}%">${p[0]}</div>`;
            });
        }
    }

    function toggleFilterMode() {
        const m = document.getElementById('filter-mode').value;
        document.querySelectorAll('.mode-gregorian, .mode-hijri, .mode-range').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll(`.mode-${m}`).forEach(el => el.classList.remove('hidden'));
    }

    function applyCalendarFilters() {
        const mode = document.getElementById('filter-mode').value;
        let filtered = [];
        if (mode === 'gregorian') {
            const m = document.getElementById('filter-greg-month').value;
            filtered = state.annualData.filter(d => parseInt(d.date.gregorian.month.number) == m);
        } else if (mode === 'hijri') {
            const m = document.getElementById('filter-hijri-month').value;
            filtered = state.annualData.filter(d => parseInt(d.date.hijri.month.number) == m);
        } else {
            const f = new Date(document.getElementById('filter-from-date').value).getTime();
            const t = new Date(document.getElementById('filter-to-date').value).getTime();
            filtered = state.annualData.filter(d => {
                const p = d.date.gregorian.date.split('-');
                const cur = new Date(`${p[2]}-${p[1]}-${p[0]}`).getTime();
                return cur >= f && cur <= t;
            });
        }
        const tb = document.querySelector('#month-table tbody');
        tb.innerHTML = filtered.map(d => `<tr><td>${d.date.gregorian.date}<br><small style="color:var(--primary)">${d.date.hijri.day} ${d.date.hijri.month.en}</small></td><td>${formatTime(d.timings.Fajr)}</td><td>${formatTime(d.timings.Sunrise)}</td><td>${formatTime(d.timings.Dhuhr)}</td><td>${formatTime(d.timings.Asr)}</td><td>${formatTime(d.timings.Maghrib)}</td><td>${formatTime(d.timings.Isha)}</td></tr>`).join('');
    }

    function updateUI() {
        drawClockMarkers();
        applyCalendarFilters();
    }

    function switchTab(id, btn) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }
</script>
</body>
</html>
